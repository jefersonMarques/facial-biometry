name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/browser-first-capture-v2
      - feature/identity-check-cnh
  pull_request:
    branches:
      - main
      - feature/liveness-v2

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: faceproof
          POSTGRES_PASSWORD: faceproof-ci-only
          POSTGRES_DB: faceproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faceproof -d faceproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FACEPROOF_ANALYTICS_TEST_DATABASE_URL: postgres://faceproof:faceproof-ci-only@127.0.0.1:5432/faceproof_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Verify Go modules
        working-directory: services/api
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Test Go API
        working-directory: services/api
        run: go test ./...
      - name: Validate Linux development scripts
        run: |
          bash -n scripts/run-dev.sh scripts/create-identity-check.sh scripts/build-liveness-wasm.sh scripts/build-opencv-parity.sh scripts/build-biometric-shadow.sh scripts/build-biometric-core.sh scripts/build-model-pack.sh scripts/start-analytics-postgres.sh scripts/setup-analytics-postgres-native.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine dependencies
        run: python -m pip install -r services/engine/requirements.txt
      - name: Test biometric engine
        env:
          PYTHONPATH: services/engine
        run: python -m unittest discover -s services/engine/tests -v

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure liveness core
        run: cmake -S faceproof-liveness-core -B build/liveness-core -DCMAKE_BUILD_TYPE=Release
      - name: Build liveness core
        run: cmake --build build/liveness-core --config Release
      - name: Test liveness core
        run: ctest --test-dir build/liveness-core -C Release --output-on-failure
      - name: Configure biometric secure core
        run: cmake -S faceproof-biometric-core -B build/biometric-core -DCMAKE_BUILD_TYPE=Release
      - name: Build biometric secure core
        run: cmake --build build/biometric-core --config Release
      - name: Test biometric secure core
        run: ctest --test-dir build/biometric-core -C Release --output-on-failure

  biometric-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine dependencies
        run: python -m pip install -r services/engine/requirements.txt
      - name: Configure biometric secure core
        run: cmake -S faceproof-biometric-core -B build/biometric-core -DCMAKE_BUILD_TYPE=Release
      - name: Build biometric secure core
        run: cmake --build build/biometric-core --config Release
      - name: Compare Python and C++ scoring
        env:
          PYTHONPATH: services/engine
          FACEPROOF_BIOMETRIC_MATH_CLI: ${{ github.workspace }}/build/biometric-core/faceproof_biometric_math_cli
        run: python -m unittest services.engine.tests.test_biometric_core_parity -v

  biometric-vision-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache OpenCV 4.14 native runtime
        uses: actions/cache@v4
        with:
          path: build/opencv-4.14.0/install
          key: opencv-4.14.0-minimal-v1-${{ runner.os }}-${{ hashFiles('scripts/build-opencv-parity.sh') }}
      - name: Cache ONNX Runtime native package
        uses: actions/cache@v4
        with:
          path: build/onnxruntime-1.30.0
          key: onnxruntime-1.30.0-linux-x64-v1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libjpeg-dev libpng-dev zlib1g-dev
          python -m pip install numpy==2.4.6 opencv-python-headless==4.14.0.94 onnxruntime==1.30.0
      - name: Build pinned native OpenCV
        run: bash scripts/build-opencv-parity.sh
      - name: Prepare pinned native ONNX Runtime
        run: python scripts/vendor-onnxruntime.py
      - name: Download pinned biometric models
        run: python models/download_models.py
      - name: Download pinned face fixture
        run: python scripts/download-biometric-parity-fixture.py
      - name: Configure OpenCV biometric secure core
        run: >
          cmake -S faceproof-biometric-core -B build/biometric-vision
          -DCMAKE_BUILD_TYPE=Release
          -DFACEPROOF_BIOMETRIC_WITH_OPENCV=ON
          -DFACEPROOF_BIOMETRIC_WITH_ONNXRUNTIME=ON
          -DFACEPROOF_ONNXRUNTIME_ROOT=${{ github.workspace }}/build/onnxruntime-1.30.0
          -DOpenCV_DIR=${{ github.workspace }}/build/opencv-4.14.0/install/lib/cmake/opencv4
      - name: Build OpenCV biometric secure core
        run: cmake --build build/biometric-vision --config Release
      - name: Verify production Secure Core shared library
        run: |
          test -s build/biometric-vision/libfaceproof_core.so
          nm -D build/biometric-vision/libfaceproof_core.so | grep -q ' fp_secure_core_create$'
          nm -D build/biometric-vision/libfaceproof_core.so | grep -q ' fp_secure_core_analyze_identity$'
          nm -D build/biometric-vision/libfaceproof_core.so | grep -q ' fp_secure_core_reference_jpeg$'
      - name: Compare Python and C++ vision pipeline
        env:
          PYTHONPATH: services/engine
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/opencv-4.14.0/install/lib:${{ github.workspace }}/build/onnxruntime-1.30.0/lib
          FACEPROOF_BIOMETRIC_VISION_CLI: ${{ github.workspace }}/build/biometric-vision/faceproof_biometric_vision_cli
          FACEPROOF_BIOMETRIC_REFERENCE_CLI: ${{ github.workspace }}/build/biometric-vision/faceproof_biometric_reference_cli
          FACEPROOF_BIOMETRIC_PAD_CLI: ${{ github.workspace }}/build/biometric-vision/faceproof_biometric_pad_cli
          FACEPROOF_SECURE_CORE_LIBRARY: ${{ github.workspace }}/build/biometric-vision/libfaceproof_core.so
          FACEPROOF_BIOMETRIC_PARITY_IMAGE: ${{ github.workspace }}/build/biometric-parity/astronaut.png
          FACEPROOF_YUNET_MODEL: ${{ github.workspace }}/models/yunet/face_detection_yunet_2023mar.onnx
          FACEPROOF_SFACE_MODEL: ${{ github.workspace }}/models/sface/face_recognition_sface_2021dec.onnx
          FACEPROOF_MINIFAS_MODEL: ${{ github.workspace }}/models/minifasnet/MiniFASNetV2.onnx
        run: >
          python -m unittest discover
          -s services/engine/tests
          -p 'test_*_parity.py'
          -v

      - name: Exercise low-resolution benchmark on public face fixture
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/opencv-4.14.0/install/lib:${{ github.workspace }}/build/onnxruntime-1.30.0/lib
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import cv2

          source = Path("build/biometric-parity/astronaut.png")
          face = cv2.imread(str(source))
          assert face is not None
          detector = cv2.FaceDetectorYN.create(
              "models/yunet/face_detection_yunet_2023mar.onnx",
              "", (face.shape[1], face.shape[0]),
              score_threshold=0.7,
          )
          _, faces = detector.detect(face)
          assert faces is not None and len(faces) > 0
          x, y, w, h = [int(v) for v in faces[0][:4]]
          margin = int(max(w, h) * 0.15)
          x1, y1 = max(0, x - margin), max(0, y - margin)
          x2, y2 = min(face.shape[1], x + w + margin), min(face.shape[0], y + h + margin)
          tiny = cv2.resize(face[y1:y2, x1:x2], (45, 61), interpolation=cv2.INTER_AREA)
          temporary = Path("/tmp/faceproof-low-resolution-fixture.png")
          assert cv2.imwrite(str(temporary), tiny)

          result = subprocess.run([
              "build/biometric-vision/faceproof_low_resolution_benchmark",
              str(source), str(temporary), str(source),
              "models/yunet/face_detection_yunet_2023mar.onnx",
              "models/sface/face_recognition_sface_2021dec.onnx",
          ], capture_output=True, text=True, check=True)
          report = json.loads(result.stdout)
          assert report["mode"] == "offline_low_resolution_diagnostic"
          assert report["liveIsSingleFrameProxy"] is True
          assert (report["vioOriginalWidth"], report["vioOriginalHeight"]) == (45, 61)
          assert {item["method"] for item in report["variants"]} == {
              "production_cubic", "nearest", "linear", "lanczos4"
          }
          assert all("embedding" not in item for item in report["variants"])
          assert all("pdfLive" in item and "vioLive" in item
                     and "pdfVio" in item for item in report["variants"])
          assert report["variants"][0]["pdfLive"]["robustCosine"] > 0.99
          print("Low-resolution benchmark smoke test passed")
          PY

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "6.0.10"
          actions-cache-folder: emsdk-cache
      - name: Build and publish WASM liveness core
        run: bash scripts/build-liveness-wasm.sh
      - name: Verify WASM artifacts
        run: |
          test -s build/liveness-wasm/faceproof-liveness-core.js
          test -s build/liveness-wasm/faceproof-liveness-core.wasm
          test -s apps/web-sdk/wasm/liveness-core/faceproof-liveness-core.js
          test -s apps/web-sdk/wasm/liveness-core/faceproof-liveness-core.wasm
          test -s apps/web-sdk/wasm/liveness-core/faceproof-liveness-core.manifest.json
          grep -q "HEAPF64" build/liveness-wasm/faceproof-liveness-core.js
          python -c 'import json; d=json.load(open("apps/web-sdk/wasm/liveness-core/faceproof-liveness-core.manifest.json")); assert d["version"]=="0.1.0"; assert any(x["path"]=="faceproof-liveness-core.wasm" and len(x["sha256"])==64 for x in d["files"])'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web SDK dependencies
        working-directory: apps/web-sdk
        run: npm install
      - name: Verify pinned MediaPipe package
        run: |
          python scripts/vendor-mediapipe.py --verify-lock
          python scripts/vendor-mediapipe.py --verify-package
          ! grep -R -E "cdn\.jsdelivr\.net|storage\.googleapis\.com/mediapipe-models" apps/web-sdk/src apps/web-sdk/dist
      - name: Typecheck web SDK
        working-directory: apps/web-sdk
        run: npm run typecheck
      - name: Build web SDK
        working-directory: apps/web-sdk
        run: npm run build
      - name: Test web capture core
        working-directory: apps/web-sdk
        run: node --test tests/liveness-v2.test.mjs tests/local-capture-gate.test.mjs tests/capture-lifecycle.test.mjs
      - name: Verify admin JavaScript syntax
        run: node --check apps/admin/app.js
      - name: Verify committed web bundle
        run: |
          git diff --exit-code -- apps/web-sdk/dist
          test -z "$(git ls-files --others --exclude-standard apps/web-sdk/dist)"
